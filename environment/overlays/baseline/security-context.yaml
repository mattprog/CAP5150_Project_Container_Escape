apiVersion: apps/v1
kind: Deployment
metadata:
  name: escape-target
spec:
  template:
    spec:
      containers:
        - name: target
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              add: ["NET_RAW"]
            seccompProfile:
              type: Unconfined
