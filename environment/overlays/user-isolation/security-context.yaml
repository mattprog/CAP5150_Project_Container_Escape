apiVersion: apps/v1
kind: Deployment
metadata:
  name: escape-target
spec:
  template:
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: target
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: Unconfined
