apiVersion: apps/v1
kind: Deployment
metadata:
  name: escape-target
spec:
  template:
    spec:
      containers:
        - name: target
          env:
            - name: HTTP_PORT
              value: "80"
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            seccompProfile:
              type: Unconfined
